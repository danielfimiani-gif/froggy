name: Build project

on:
  push:
  pull_request:
  workflow_dispatch:

# Si se pushea dos veces seguidas, cancela la corrida vieja.
# Un build de Unity tarda mucho como para dejar corriendo trabajo que ya no sirve.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1) UNIT TESTS  (EditMode + PlayMode, en paralelo entre si)
  # ---------------------------------------------------------------------------
  test:
    name: Test ${{ matrix.testMode }}
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        testMode:
          - editmode
          - playmode

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      # Cache propio de los tests: el Test Runner corre sobre el target del
      # editor (Linux), NO sobre WebGL ni Windows. Mezclarlo con el cache de
      # los builds haria que cada job le pise los artefactos al otro.
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-test-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-test-

      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.0.36f1
          testMode: ${{ matrix.testMode }}
          artifactsPath: ${{ matrix.testMode }}-artifacts
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: ${{ matrix.testMode }} Test Results
          coverageOptions: 'generateAdditionalMetrics;generateHtmlReport;generateBadgeReport;assemblyFilters:+Scripts'

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test-results-${{ matrix.testMode }}
          path: ${{ steps.tests.outputs.artifactsPath }}
          retention-days: 90

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Coverage-results-${{ matrix.testMode }}
          path: ${{ steps.tests.outputs.coveragePath }}
          retention-days: 90

  # ---------------------------------------------------------------------------
  # 2) BUILDS  (WebGL + StandaloneWindows64, en paralelo entre si)
  # ---------------------------------------------------------------------------
  buildForAllSupportedPlatforms:
    name: Build for ${{ matrix.targetPlatform }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        targetPlatform:
          - WebGL
          - StandaloneWindows64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      # El runner de GitHub trae ~14GB libres. La imagen de Unity + WebGL
      # se los come. Sin esto el build muere con "no space left on device".
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          docker image prune --all --force
          df -h

      # Cache de Library POR PLATAFORMA. Unity guarda ahi los assets ya
      # importados y compilados para el target activo: un cache compartido
      # entre WebGL y Windows se pisa a si mismo y no sirve de nada.
      # El hash invalida el cache solo cuando cambia el proyecto de verdad.
      #
      # OJO: el restore-key NO debe ser el prefijo generico "Library-".
      # Ese prefijo matchea cualquier cache (incluido el de los tests) y
      # Unity termina reimportando todo igual, con el costo extra de bajar
      # ~1 GB inutil. Solo cae al cache de su propia plataforma.
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.0.36f1
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: froggy
          # El repo no tiene tags de git. El default (Semantic) los necesita
          # para armar el numero de version y falla sin ellos.
          versioning: None

      # 90 dias (el maximo para repos publicos). Con 14 los builds se borran
      # antes de que alguien llegue a descargarlos.
      - uses: actions/upload-artifact@v4
        with:
          name: Build-${{ matrix.targetPlatform }}
          path: build/${{ matrix.targetPlatform }}
          retention-days: 90

  # ---------------------------------------------------------------------------
  # 3) PUBLICAR UN RELEASE CON LOS BUILDS
  #
  # Funciona en dos modos, segun que dispare el workflow:
  #
  #   push a master  -> actualiza el release "latest" con los ultimos builds.
  #                     Siempre hay algo descargable desde la portada, sin
  #                     tener que acordarse de taggear.
  #   tag v*         -> crea un release versionado (ej: v1.0.0) que queda fijo.
  #
  # Los artifacts de Actions siguen existiendo igual; esto es para que la
  # descarga este a un click desde la portada del repositorio.
  # ---------------------------------------------------------------------------
  release:
    name: Publicar Release
    runs-on: ubuntu-latest
    needs: buildForAllSupportedPlatforms
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Descargar los builds
        uses: actions/download-artifact@v4
        with:
          pattern: Build-*
          path: artifacts

      # Un release adjunta archivos sueltos, no carpetas: hay que empaquetar.
      - name: Empaquetar cada plataforma
        run: |
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            (cd "$dir" && zip -qr "../../${name}.zip" .)
          done
          cd ..
          ls -lh ./*.zip

      - name: Publicar o actualizar el release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
            TITLE="Frogger ${GITHUB_REF_NAME}"
          else
            TAG="latest"
            TITLE="Ultimo build de master"
          fi

          NOTES="Builds generados automaticamente por GitHub Actions desde el commit \`${GITHUB_SHA::7}\`.

          - **Build-StandaloneWindows64.zip** — ejecutable de Windows 64 bits: descomprimir y correr \`froggy.exe\`.
          - **Build-WebGL.zip** — build web lista para subir a itch.io o similar. No se abre con doble click: necesita un servidor."

          # gh infiere el repositorio leyendo el .git del directorio, y este job
          # no hace checkout (solo descarga artifacts). Se lo pasamos explicito
          # con --repo en vez de clonar el repo entero al pedo.
          REPO="${GITHUB_REPOSITORY}"

          # Si el release ya existe se reemplazan los adjuntos (--clobber);
          # si no, se crea. Asi "latest" queda siempre apuntando al ultimo build.
          if gh release view "${TAG}" --repo "${REPO}" > /dev/null 2>&1; then
            gh release edit "${TAG}" --repo "${REPO}" --title "${TITLE}" --notes "${NOTES}"
            gh release upload "${TAG}" --repo "${REPO}" \
              ./Build-WebGL.zip ./Build-StandaloneWindows64.zip --clobber
          else
            gh release create "${TAG}" --repo "${REPO}" \
              --title "${TITLE}" \
              --notes "${NOTES}" \
              ./Build-WebGL.zip \
              ./Build-StandaloneWindows64.zip
          fi
